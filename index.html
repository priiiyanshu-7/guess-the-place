<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>guess the spot | glide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Text&family=Fraunces:ital,opsz,wght@0,9..144,400..700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --blue:#1667E8; --blue-700:#0A3FA8; --blue-900:#062B75;
    --mist:#CFE0FF; --ink:#0C1220;
    --serif:'Fraunces',Georgia,serif;
    --serif-clue:'DM Serif Text',Georgia,serif;
    --sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  [hidden]{display:none !important}
  html,body{margin:0;overflow-x:hidden}
  body{font-family:var(--sans);color:#fff;
    background:linear-gradient(165deg,#2278F5,var(--blue) 36%,var(--blue-700) 74%,var(--blue-900));
    -webkit-font-smoothing:antialiased}

  .shell{min-height:100dvh;max-width:480px;margin:0 auto;display:flex;flex-direction:column;
    padding:14px 16px 0}

  .top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex:0 0 auto}
  .brand{display:flex;align-items:center;gap:8px}
  .brand .mark{width:26px;height:26px;object-fit:contain;display:block}
  .brand b{font-weight:600;font-size:19px;letter-spacing:-.04em}
  .dl{display:inline-flex;align-items:center;gap:7px;background:#fff;color:var(--ink);border:0;
    border-radius:12px;padding:5px 13px 5px 5px;font:inherit;font-size:12px;font-weight:600;
    cursor:pointer;white-space:nowrap}
  .dl .appicon{width:24px;height:24px;border-radius:7px;display:block;object-fit:cover}

  .bar{display:flex;align-items:center;gap:10px;margin:12px 0 8px;flex:0 0 auto;
    font-size:12px;color:rgba(255,255,255,.8)}
  .ticks{display:flex;gap:5px;flex:1 1 auto}
  .ticks i{flex:1 1 auto;height:3px;border-radius:2px;background:rgba(255,255,255,.28)}
  .ticks i{transition:background .35s ease,transform .35s ease}
  .ticks i.on{background:#fff}
  .ticks i.pop{transform:scaleY(2.2)}

  .card{background:#fff;color:var(--ink);border-radius:22px;overflow:hidden;
    box-shadow:0 18px 40px rgba(3,18,56,.3);flex:0 0 auto;display:flex;flex-direction:column}
  /* fixed 140px photo on every question, so the card starts the same way each
     time; the card still hugs its content below that */
  .shot{position:relative;flex:0 0 auto;margin:0;height:140px;overflow:hidden;
    border-radius:22px 22px 0 0;background:#DCE6F5}
  .shot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}

  .pad{flex:0 0 auto;padding:16px 18px 18px;display:flex;flex-direction:column;gap:14px}
  /* #rev is an empty div until answered; without this it still counts as a
     flex item and doubles the gap between the clue and the options */
  .pad > :empty{display:none}
  /* DM Serif Text is denser and darker than Fraunces, so it gets a little more
     leading to keep a 7-line clue from reading as a solid block */
  .clue{font-family:var(--serif-clue);font-size:clamp(15.5px,4.2vw,17.5px);
    line-height:1.46;margin:0}

  .rev{display:block}
  .rhead{display:flex;align-items:center;gap:9px;margin-bottom:8px}
  .rev .e{font-size:24px;line-height:1}
  .rev h2{font-family:var(--serif);font-weight:600;font-size:16.5px;letter-spacing:-.02em;margin:0}
  .chips{display:flex;flex-wrap:wrap;align-items:center;gap:5px;margin-top:9px}
  .chips .lbl{font-family:var(--serif);font-style:italic;font-size:11.5px;color:#9BA4B4;margin-right:2px}
  .chip{background:#EDF3FE;border:1px solid #DCE7FA;color:#17325C;border-radius:999px;
    padding:3px 9px;font-size:11.5px;line-height:1.25}
  .meta{display:flex;flex-wrap:wrap;gap:3px 12px;margin-top:9px;font-size:11.5px;color:#7A8497}
  .meta b{font-weight:600;color:#2B3446}
  .rev p{font-size:13px;line-height:1.45;color:#4A5468;margin:0}

  .opts{display:grid;gap:7px}
  .opt{font:inherit;font-size:clamp(13.5px,3.7vw,15px);color:var(--ink);text-align:left;
    background:#F4F7FD;border:1.5px solid #F4F7FD;border-radius:12px;padding:12px 14px;
    cursor:pointer;width:100%;line-height:1.25;display:flex;align-items:center;gap:10px;
    transition:background .28s ease,border-color .28s ease,color .28s ease,
               opacity .28s ease,transform .22s ease}
  .opt:hover:not(:disabled){border-color:var(--blue);background:#fff}
  .opt:active:not(:disabled){transform:scale(.985)}
  .opt:focus-visible{outline:2.5px solid var(--blue);outline-offset:2px}
  .opt::after{margin-left:auto;font-size:14px;font-weight:600;opacity:0;
    transform:scale(.6);transition:opacity .3s ease .12s,transform .3s ease .12s}
  .opt.right{background:var(--blue);border-color:var(--blue);color:#fff}
  .opt.right::after{content:"✓";opacity:1;transform:scale(1)}
  .opt.wrong{background:#FFF0F1;border-color:#E5484D;color:#C42B31}
  .opt.wrong::after{content:"✕";opacity:1;transform:scale(1)}
  .opt.dim{opacity:.32}
  .burst{position:absolute;inset:0;overflow:hidden;pointer-events:none}
  .burst span{position:absolute;left:50%;bottom:14px;font-size:22px;
    animation:fly 1.1s cubic-bezier(.25,.6,.35,1) both}
  @keyframes fly{
    0%{opacity:0;transform:translate(-50%,0) scale(.5) rotate(0)}
    18%{opacity:1}
    100%{opacity:0;transform:translate(calc(-50% + var(--x)),-165px) scale(1.2) rotate(var(--r))}}

  @media (prefers-reduced-motion:no-preference){
    .card.in{animation:cardin .4s cubic-bezier(.2,.8,.3,1)}
    @keyframes cardin{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
    .rev.fresh .chip{animation:chipin .32s cubic-bezier(.2,.9,.3,1) both}
    .rev.fresh .chip:nth-child(2){animation-delay:.24s}
    .rev.fresh .chip:nth-child(3){animation-delay:.32s}
    @keyframes chipin{from{opacity:0;transform:translateY(6px) scale(.9)}to{opacity:1;transform:none}}
    .rev.fresh .meta{animation:chipin .32s ease .38s both}
    .recap span{animation:chipin .4s ease both}
    .recap span:nth-child(2){animation-delay:.07s}
    .recap span:nth-child(3){animation-delay:.14s}
    .recap span:nth-child(4){animation-delay:.21s}
    .recap span:nth-child(5){animation-delay:.28s}
    .pitch{animation:chipin .5s ease .42s both}
    .opt.pop{animation:pop .34s ease}
    @keyframes pop{35%{transform:scale(1.025)}}
    .opt.shake{animation:shake .4s ease}
    @keyframes shake{15%{transform:translateX(-6px)}35%{transform:translateX(5px)}
      55%{transform:translateX(-3px)}75%{transform:translateX(2px)}}
    .rev.fresh{animation:rise .38s cubic-bezier(.2,.8,.3,1) .1s both}
    @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
    .rev.fresh .e{animation:spin .5s cubic-bezier(.3,.9,.3,1) .16s both}
    @keyframes spin{from{transform:rotate(-25deg) scale(.5);opacity:0}to{opacity:1}}
  }

  .nav{flex:0 0 auto;display:flex;gap:9px;margin:18px 0 0;
    padding-bottom:calc(18px + env(safe-area-inset-bottom))}
  .btn{font:inherit;font-weight:600;font-size:15.5px;background:#fff;color:var(--blue-700);
    border:0;border-radius:999px;padding:14px 20px;cursor:pointer;flex:1 1 auto}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .btn.ghost{flex:0 0 auto;background:none;color:#fff;border:1.5px solid rgba(255,255,255,.5);
    padding:14px 20px}
  .btn.ghost:disabled{opacity:.3}

  .start{flex:1 1 auto;display:flex;flex-direction:column;justify-content:center;padding:24px 0}
  .kicker{font-family:var(--serif);font-style:italic;font-size:13.5px;color:rgba(255,255,255,.7);
    margin:0 0 12px}
  .start h1{font-family:var(--serif);font-weight:600;font-size:clamp(38px,11vw,56px);
    line-height:.98;letter-spacing:-.035em;margin:0}
  .start .sub{font-family:var(--serif);font-style:italic;font-size:clamp(14.5px,4vw,16.5px);
    line-height:1.5;color:var(--mist);margin:16px 0 0;max-width:32ch}
  .deck{display:flex;flex-wrap:wrap;gap:7px;margin:26px 0 0}
  .deck span{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;
    font-size:21px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.28)}
  @media (prefers-reduced-motion:no-preference){
    .deck span{animation:chipin .45s cubic-bezier(.2,.9,.3,1) both}
    .deck span:nth-child(2){animation-delay:.06s}
    .deck span:nth-child(3){animation-delay:.12s}
    .deck span:nth-child(4){animation-delay:.18s}
    .deck span:nth-child(5){animation-delay:.24s}
  }

  .final{flex:1 1 auto;display:flex;flex-direction:column;justify-content:center;
    text-align:center;padding:24px 0}
  .num{font-family:var(--serif);font-size:clamp(64px,15vh,104px);line-height:.85;letter-spacing:-.05em}
  .num em{font-style:normal;font-size:.3em;color:rgba(255,255,255,.55)}
  .final h2{font-family:var(--serif);font-weight:600;font-size:clamp(24px,6.4vw,32px);
    letter-spacing:-.03em;line-height:1.05;margin:16px 0 0}
  .final p{font-family:var(--serif);font-style:italic;color:var(--mist);font-size:15px;margin:9px 0 0}
  .recap{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin:22px 0 0}
  .recap span{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;font-size:12px;
    border:1px solid rgba(255,255,255,.34);border-radius:999px;color:#fff}
  .recap span.miss{opacity:.42}
  .final .pitch{font-family:var(--serif);font-style:italic;font-size:15px;line-height:1.5;
    color:var(--ink);background:#fff;border-radius:18px;padding:16px 20px;
    max-width:33ch;margin:24px auto 0;
    box-shadow:0 14px 32px rgba(3,18,56,.26)}
  .why{list-style:none;padding:0;margin:16px auto 0;max-width:33ch;text-align:left}
  .why li{position:relative;padding-left:16px;font-size:13px;line-height:1.5;
    color:rgba(255,255,255,.82);margin-top:7px}
  .why li:before{content:"";position:absolute;left:0;top:8px;width:5px;height:5px;
    border-radius:50%;background:rgba(255,255,255,.5)}
  .fix{font-family:var(--serif);font-style:italic;font-size:14.5px;color:#fff;
    margin:16px 0 0 !important}
</style>
</head>

 {min:5,t:"okay, we are impressed",l:""},
 {min:4,t:"so close it stings",l:""},
 {min:3,t:"pretty good, honestly",l:""},
 {min:2,t:"a decent start",l:""},
 {min:0,t:"oh, you are in for a treat",l:""}
];

let picked=new Array(SPOTS.length).fill(null), i=0, ended=false;
const $=id=>document.getElementById(id);
const score=()=>picked.reduce((a,p,n)=>a+(p===SPOTS[n].answer?1:0),0);

function go(view,n,replace){
  const st={view,n};
  replace?history.replaceState(st,''):history.pushState(st,'');
  paint(st);
}
onpopstate=e=>paint(e.state||{view:'quiz',n:0});

function paint(st){
  const view = (st && st.view) || 'start';
  ended = view==='done';
  const starting = view==='start';
  $('start').hidden = !starting;
  $('quiz').hidden  = starting || ended;
  $('bar').hidden   = starting || ended;
  $('done').hidden  = !ended;
  if(starting) begin();
  else if(ended) result();
  else { i=st.n||0; draw(); }
}

function begin(){
  $('deck').innerHTML = SPOTS.map(s=>`<span>${s.emoji}</span>`).join('');
  buttons();
}

function draw(){
  const s=SPOTS[i], p=picked[i], open=p!==null;
  $('ticks').innerHTML=SPOTS.map((_,n)=>`<i class="${picked[n]!==null||n===i?'on':''}"></i>`).join('');
  const card=$('quiz'); card.classList.remove('in'); void card.offsetWidth; card.classList.add('in');
  $('shot').hidden=!s.img;
  $('shot').innerHTML=s.img?`<img src="${s.img}" alt="">`:'';
  $('clue').textContent=s.clue; $('clue').hidden=open;
  $('opts').innerHTML=s.options.map((o,n)=>`<button class="opt" data-n="${n}" ${open?'disabled':''}>${o}</button>`).join('');
  if(open){ mark(p,false); reveal(p===SPOTS[i].answer,false); }
  else { $('opts').querySelectorAll('.opt').forEach(b=>b.onclick=()=>choose(+b.dataset.n)); $('rev').innerHTML=''; }
  buttons();
}

function mark(p,fresh){
  $('opts').querySelectorAll('.opt').forEach(b=>{
    const n=+b.dataset.n; b.disabled=true;
    const state = n===SPOTS[i].answer?'right':(n===p?'wrong':'dim');
    b.classList.add(state);
    if(fresh && state!=='dim') b.classList.add(state==='right'?'pop':'shake');
  });
}

function reveal(ok,fresh){
  const s=SPOTS[i];
  $('rev').innerHTML=`<div class="rev${fresh?' fresh':''}">
    <div class="rhead"><span class="e">${s.emoji}</span><h2>${s.name}</h2></div>
    <p>${s.blurb}</p>
    <div class="chips"><span class="lbl">get</span>${s.get.map(g=>`<span class="chip">${g}</span>`).join('')}</div>
    <div class="meta"><span>${s.where}</span></div>
  </div>`;
}

function choose(n){
  picked[i]=n;
  $('clue').hidden=true;
  $('ticks').children[i].className='on';
  const right=n===SPOTS[i].answer;
  const tick=$('ticks').children[i];
  tick.classList.add('pop'); setTimeout(()=>tick.classList.remove('pop'),400);
  if(right) burst(SPOTS[i].emoji);
  mark(n,true); reveal(right,true); buttons();
}

function burst(emoji){
  if($('shot').hidden) return;
  const b=document.createElement('div'); b.className='burst';
  for(let k=0;k<9;k++){
    const p=document.createElement('span');
    p.textContent=emoji;
    p.style.setProperty('--x',(Math.random()*200-100).toFixed(0)+'px');
    p.style.setProperty('--r',(Math.random()*90-45).toFixed(0)+'deg');
    p.style.animationDelay=(k*45)+'ms';
    b.appendChild(p);
  }
  $('shot').appendChild(b);
  setTimeout(()=>b.remove(),1500);
}

function countTo(el,n){
  let v=0; el.textContent='0';
  if(!n) return;
  const step=()=>{ v++; el.textContent=v; if(v<n) setTimeout(step,420/n); };
  setTimeout(step,200);
}

function buttons(){
  if(!$('start').hidden){
    $('back').hidden=true;
    $('next').textContent="let's go"; $('next').disabled=false;
    return;
  }
  const answered = picked[i]!==null;
  if(ended){
    $('back').hidden=true;
    $('next').textContent='Get glide'; $('next').disabled=false;
    return;
  }
  $('back').hidden=false; $('back').disabled=false;
  $('back').textContent='Back';
  $('next').disabled=!answered;
  $('next').textContent = i===SPOTS.length-1 ? 'See your score' : 'Next spot';
}

function result(){
  const sc=score(), v=V.find(v=>sc>=v.min);
  countTo($('got'),sc); $('outof').textContent='/'+SPOTS.length;
  $('title').innerHTML=v.t;
  $('recap').innerHTML=SPOTS.map((s,n)=>
    `<span class="${picked[n]===s.answer?'':'miss'}">${s.emoji} ${s.name}</span>`).join('');
  $('pitch').textContent = [
    "all five are new to you. save them in glide and you have a plan ready for the weekend.",
    "four new ones. put them in glide so they are there when nobody can decide where to go.",
    "three you had not heard of. save them in glide instead of screenshotting and forgetting.",
    "two got past you. keep them in glide with the rest of the places you mean to try.",
    "one away. save it in glide now and it will still be there on friday.",
    "genuinely impressive, 10 on 10. use glide to save the next spot you find on instagram."
  ][sc];
  buttons();
}

$('back').onclick=()=>history.back();
$('next').onclick=()=>{
  if(!$('start').hidden) return go('quiz',0);
  if(ended) return openGlide();
  i===SPOTS.length-1 ? go('done') : go('quiz',i+1);
};
$('dl').onclick=openGlide;

go('start',0,true);
</script>
</body>
</html>
